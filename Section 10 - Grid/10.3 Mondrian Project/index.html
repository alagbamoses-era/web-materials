<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;

    }
    .container {
      height: 748px;
      width: 748px;
      display: grid;
      background-color: black;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
      
      
    }
    .items {
      background-color: #F0F1EC;
    
      
  
    }

    .red {
      background-color: #E72F24 ;
    }
    .white1 {
      background-color: #F0F1EC;
      grid-column: span 3;

    }
    .white2 {
      grid-row: span 2;
    }
    .white3 {
      grid-area: 2 / 2 / 4 /4;
    }

    .yellow {
      background-color: #F9D01E;
    }

    .blue {
      background-color: #004592 ;
    }

    .black {
      background-color: #232629;
    }

    

  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="items red">1</div>
    <div class="items white1" >2</div>
    <div class="items white2">3</div>
    <div class="items white3">4</div>
    <div class="items blue">5</div>
    <div class="items white5">6</div>
    <div class="items white6" >7</div>
    <div class="items yellow">8</div>
    <div class="items black">9</div>
    
       </div>
</body>

</html>
